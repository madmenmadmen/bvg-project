[package]
name = "bvg-wasm"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bvg = { path = "../bvg-rust" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CanvasPattern",
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "ImageBitmap",
    "ImageData",
    "Blob",
    "Response",
    "BlobPropertyBag",
    "Url",
    "Window",
]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"