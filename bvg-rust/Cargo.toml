[package]
name = "bvg"
version = "1.0.0"
edition = "2024"
description = "BVG - Universal Binary Vector Graphics container"
license = "MIT"
repository = "https://github.com/madmenmadmen/bvg-project"
homepage = "https://github.com/madmenmadmen/bvg-project"
keywords = ["graphics", "vector", "binary", "format", "bvg"]
categories = ["multimedia::images", "encoding"]

[dependencies]
zstd = "0.13"
lz4_flex = "0.11"
flate2 = "1.0"

[dev-dependencies]
walkdir = "2"

[[bin]]
name = "bvg-rust"
path = "src/bin/main.rs"