[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bvg"
version = "1.0.4"
description = "BVG - Universal Binary Vector Graphics container"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BVG contributors" }]
keywords = [
    "bvg", "binary", "vector", "graphics", "2d",
    "svg alternative", "zstd", "lz4", "zlib", "rle",
    "container", "format"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard>=0.21"]
lz4  = ["lz4>=4.0"]
img  = ["Pillow>=10"]
qt   = ["PyQt6>=6.5"]
all  = ["zstandard>=0.21", "lz4>=4.0", "Pillow>=10", "PyQt6>=6.5"]
dev  = ["pytest>=7", "zstandard>=0.21", "lz4>=4.0", "Pillow>=10"]

[project.scripts]
bvg = "bvg.cli:main"
bvg-viewer = "bvg.viewer:main"

[project.urls]
Homepage = "https://github.com/madmenmadmen/bvg-project"
Repository = "https://github.com/madmenmadmen/bvg-project"
Specification = "https://github.com/madmenmadmen/bvg-spec"
Issues = "https://github.com/madmenmadmen/bvg-project/issues"

[tool.setuptools.packages.find]
include = ["bvg*"]